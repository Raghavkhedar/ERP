{% if page.paginator.num_pages > 1 %}
  <nav class="mt-3 flex items-center justify-between gap-3 text-sm" aria-label="Pages">
    {% if page.has_previous %}<a href="?{{ page.base }}{% if page.base %}&{% endif %}{{ page.param }}={{ page.previous_page_number }}"{% if hx %} hx-get="?{{ page.base }}{% if page.base %}&{% endif %}{{ page.param }}={{ page.previous_page_number }}" hx-target="#rows" hx-select="#rows" hx-swap="outerHTML" hx-select-oob="#count,#pager" hx-push-url="true"{% endif %} class="inline-flex h-9 items-center rounded-lg border border-ink px-3">Previous</a>{% else %}<span class="h-9 w-20"></span>{% endif %}
    <span class="text-gray-500">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?{{ page.base }}{% if page.base %}&{% endif %}{{ page.param }}={{ page.next_page_number }}"{% if hx %} hx-get="?{{ page.base }}{% if page.base %}&{% endif %}{{ page.param }}={{ page.next_page_number }}" hx-target="#rows" hx-select="#rows" hx-swap="outerHTML" hx-select-oob="#count,#pager" hx-push-url="true"{% endif %} class="inline-flex h-9 items-center rounded-lg border border-ink px-3">Next</a>{% else %}<span class="h-9 w-20"></span>{% endif %}
  </nav>
{% endif %}
