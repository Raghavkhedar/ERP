{# Today / previous / next, shared by the month and day views. #}
<a href="{{ today_url }}" class="inline-flex h-9 items-center rounded-lg border border-ink px-3.5 text-sm font-medium transition hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-600/10">Today</a>
<div class="flex">
  <a href="{{ previous_url }}" aria-label="{{ previous_label }}" title="{{ previous_label }}" class="grid size-9 place-items-center rounded-full text-gray-500 transition hover:bg-gray-100 hover:text-gray-900">
    <svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 15-5-5 5-5"/></svg>
  </a>
  <a href="{{ next_url }}" aria-label="{{ next_label }}" title="{{ next_label }}" class="grid size-9 place-items-center rounded-full text-gray-500 transition hover:bg-gray-100 hover:text-gray-900">
    <svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg>
  </a>
</div>
