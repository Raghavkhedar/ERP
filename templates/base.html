{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Senken ERP{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
</head>
<body class="{% block body_class %}min-h-dvh bg-gray-100 text-gray-900{% endblock %}">
  {% block header %}
  <header class="flex h-11 shrink-0 items-center justify-between bg-slate-950 px-4 text-sm text-slate-200">
    <nav class="flex items-center gap-5">
      <a href="{% url 'home' %}" class="font-bold text-white">Senken ERP</a>
      {% if user.is_authenticated %}
        <a href="{% url 'chat:conversation_list' %}" class="hover:text-white">Chat</a>
        <a href="{% url 'meetings:schedule' %}" class="hover:text-white">Meetings</a>
      {% endif %}
    </nav>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="flex items-center gap-3">
        {% csrf_token %}
        <span>{{ user.display_name }}</span>
        <button type="submit" class="rounded px-2 py-0.5 hover:bg-slate-800 hover:text-white">Log out</button>
      </form>
    {% endif %}
  </header>
  {% endblock %}

  <main class="{% block main_class %}container mx-auto p-4{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
