{% load static %}
{# One dialog for every task form; buttons load a form into it with htmx and open it. #}
<script src="{% static 'js/update_files.js' %}"></script>
<dialog id="task-dialog" aria-labelledby="task-dialog-title"
        onclick="if (event.target === this) this.close()"
        class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl bg-surface p-0 text-gray-900 shadow-2xl shadow-black/50 ring-1 ring-gray-200 backdrop:bg-black/60 open:animate-rise motion-reduce:open:animate-none">
  <div id="task-dialog-body"></div>
</dialog>
