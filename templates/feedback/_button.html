{# Give feedback from any page: opens the dialog, or the form page without JavaScript. #}
<a href="{% url 'feedback:new' %}?page={{ request.get_full_path|urlencode }}"
   hx-get="{% url 'feedback:new' %}?page={{ request.get_full_path|urlencode }}" hx-target="#feedback-dialog-body"
   hx-on::after:swap="document.getElementById('feedback-dialog').showModal()"
   title="Give feedback"
   class="flex h-9 items-center gap-2 rounded-full px-2.5 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/40">
  <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12Z"/></svg>
  <span class="hidden sm:inline">Feedback</span>
</a>
