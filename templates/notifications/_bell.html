{# The bell in the top bar. Its count and the popups come from static/js/notifier.js. #}
<div class="relative" x-data="{ open: false }" @keydown.escape.window="open = false" @click.outside="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open"
          :aria-label="$store.notify.unread ? `Notifications, ${$store.notify.unread} unread` : 'Notifications'" aria-label="Notifications" title="Notifications"
          hx-get="{% url 'notifications:list' %}" hx-target="#notification-panel" hx-trigger="click"
          class="relative grid size-9 place-items-center rounded-full text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/40">
    <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/>
    </svg>
    <span x-show="$store.notify.unread" x-cloak x-text="$store.notify.unread > 99 ? '99+' : $store.notify.unread"
          class="absolute -right-0.5 -top-0.5 h-4 min-w-4 rounded-full bg-rose-500 px-1 text-center text-[0.65rem] font-semibold leading-4 text-white ring-2 ring-white"></span>
  </button>
  <div x-show="open" x-cloak x-transition.opacity.duration.120ms
       class="absolute right-0 top-full z-50 mt-2 w-80 max-w-[calc(100vw-2rem)] overflow-hidden rounded-xl border border-gray-200/80 bg-surface text-left">
    <div id="notification-panel"><p class="px-4 py-6 text-center text-sm text-gray-400">Loading…</p></div>
  </div>
</div>
