{% extends "chat/base_chat.html" %}

{% block title %}New channel · Chat{% endblock %}

{% block panel_title %}New channel{% endblock %}

{% block panel %}
  <form method="post" class="max-w-md space-y-5 p-5">
    {% csrf_token %}
    <div>
      <label for="{{ form.name.id_for_label }}" class="block text-sm font-semibold">Name</label>
      <div class="mt-1 flex items-center rounded border border-gray-300 focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
        <span class="pl-3 text-gray-400">#</span>
        <input type="text" name="name" id="{{ form.name.id_for_label }}"
               value="{{ form.name.value|default:'' }}" maxlength="80" required
               placeholder="e.g. leads"
               class="w-full rounded p-2 outline-none">
      </div>
      {% for error in form.name.errors %}
        <p class="mt-1 text-sm text-red-600">{{ error }}</p>
      {% endfor %}
    </div>
    <label class="flex items-center gap-2">
      <input type="checkbox" name="is_private" class="size-4" {% if form.is_private.value %}checked{% endif %}>
      <span>{{ form.is_private.label }}</span>
    </label>
    <button type="submit" class="rounded bg-blue-600 px-4 py-1.5 font-medium text-on-accent hover:bg-blue-700">Create</button>
  </form>
{% endblock %}
