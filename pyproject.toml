[project]
name = "erp"
version = "0.1.0"
description = "Senken ERP: empanelment module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-simple-history>=3.13.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
markers = [
    "office_hours_on_demand: let meetings pages open office hours (off by default in tests)",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]
